{# Animated Rwandan hills scene: sunrise, drifting clouds, terraces, drone. Pure SVG + CSS (static/v11.css). #}
{% macro scene(sprout=False, cls='', par='xMidYMax slice') %}
<svg class="scene {{ cls }}" viewBox="0 0 400 300" preserveAspectRatio="{{ par }}" aria-hidden="true" focusable="false">
<defs>
<linearGradient id="scSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0bf"/><stop offset=".55" stop-color="#fdf6dc"/><stop offset="1" stop-color="#e9f7e6"/></linearGradient>
<radialGradient id="scGlow"><stop offset="0" stop-color="#ffd54a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd54a" stop-opacity="0"/></radialGradient>
<linearGradient id="scH1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7ebbd"/><stop offset="1" stop-color="#a7dca0"/></linearGradient>
<linearGradient id="scH2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86d48c"/><stop offset="1" stop-color="#5fc072"/></linearGradient>
<linearGradient id="scH3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46b862"/><stop offset="1" stop-color="#2f9a50"/></linearGradient>
<linearGradient id="scH4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a8f4a"/><stop offset="1" stop-color="#1c6e37"/></linearGradient>
</defs>
<rect width="400" height="300" fill="url(#scSky)"/>
<g class="sc-sun"><circle cx="305" cy="86" r="62" fill="url(#scGlow)"/><g class="sc-rays" stroke="#ffc933" stroke-width="3" stroke-linecap="round" opacity=".8" transform-origin="305 86">{% for a in range(0,360,30) %}<line x1="305" y1="48" x2="305" y2="40" transform="rotate({{a}} 305 86)"/>{% endfor %}</g><circle cx="305" cy="86" r="27" fill="#ffc933"/><circle cx="305" cy="86" r="21" fill="#ffd95e"/></g>
<g class="sc-cloud c1" fill="#fff" opacity=".95"><ellipse cx="70" cy="62" rx="26" ry="10"/><ellipse cx="88" cy="55" rx="18" ry="11"/><ellipse cx="54" cy="57" rx="14" ry="8"/></g>
<g class="sc-cloud c2" fill="#fff" opacity=".85"><ellipse cx="200" cy="38" rx="22" ry="8"/><ellipse cx="214" cy="33" rx="14" ry="8"/></g>
<g class="sc-cloud c3" fill="#fff" opacity=".8"><ellipse cx="330" cy="140" rx="20" ry="7"/><ellipse cx="342" cy="135" rx="12" ry="7"/></g>
<g class="sc-birds" fill="none" stroke="#5b6b4d" stroke-width="1.6" stroke-linecap="round"><path class="b1" d="M120 92 q5 -6 10 0 q5 -6 10 0"/><path class="b2" d="M150 78 q4 -5 8 0 q4 -5 8 0"/><path class="b3" d="M105 70 q3 -4 6 0 q3 -4 6 0"/></g>
<path d="M0 168 C60 128 120 150 180 140 C250 128 320 150 400 126 V300 H0Z" fill="url(#scH1)"/>
<path d="M0 196 C70 160 130 186 200 170 C270 154 330 178 400 160 V300 H0Z" fill="url(#scH2)"/>
<g fill="none" stroke="#9de0a1" stroke-width="1.3" opacity=".7"><path d="M20 190 C80 168 130 188 200 176"/><path d="M60 200 C120 182 160 196 230 184"/><path d="M200 172 C270 158 330 180 390 164"/><path d="M230 186 C290 172 340 192 400 178"/></g>
<g class="sc-house"><rect x="86" y="170" width="34" height="22" rx="2" fill="#f6e6c4"/><path d="M82 172 L103 154 L124 172Z" fill="#c8693a"/><rect x="98" y="178" width="9" height="14" rx="1.5" fill="#8a5a3c"/><rect x="110" y="177" width="7" height="7" rx="1" fill="#bfe3f5"/></g>
<path d="M0 226 C60 196 140 222 210 206 C280 190 340 214 400 198 V300 H0Z" fill="url(#scH3)"/>
<g class="sc-tree t1"><rect x="44" y="196" width="4" height="20" fill="#7a4e2d"/><circle cx="46" cy="190" r="14" fill="#2c9a4b"/><circle cx="38" cy="196" r="9" fill="#37a957"/><circle cx="54" cy="196" r="9" fill="#37a957"/></g>
<g class="sc-tree t2"><rect x="338" y="190" width="4" height="22" fill="#7a4e2d"/><circle cx="340" cy="184" r="15" fill="#2c9a4b"/><circle cx="332" cy="190" r="9" fill="#37a957"/><circle cx="349" cy="190" r="9" fill="#37a957"/></g>
<path d="M0 262 C80 234 160 256 240 244 C310 234 360 248 400 238 V300 H0Z" fill="url(#scH4)"/>
<g fill="none" stroke="#1a6a35" stroke-width="2" opacity=".75"><path d="M0 272 C80 246 160 268 240 256 C310 246 360 260 400 250"/><path d="M0 282 C80 258 160 278 240 268 C310 258 360 272 400 262"/><path d="M0 292 C80 270 160 288 240 280 C310 270 360 284 400 274"/></g>
<g class="sc-drone"><g transform="translate(0 0)"><rect x="-9" y="-3" width="18" height="6" rx="3" fill="#33433a"/><rect x="-3" y="3" width="6" height="3" rx="1.5" fill="#33433a"/><line x1="-9" y1="-3" x2="-15" y2="-7" stroke="#33433a" stroke-width="2"/><line x1="9" y1="-3" x2="15" y2="-7" stroke="#33433a" stroke-width="2"/><ellipse class="rot" cx="-15" cy="-8" rx="8" ry="1.6" fill="#33433a" opacity=".75"/><ellipse class="rot" cx="15" cy="-8" rx="8" ry="1.6" fill="#33433a" opacity=".75"/><circle class="led" cx="0" cy="-3" r="1.6" fill="#ff5a4d"/></g></g>
{% if sprout %}<g class="sc-sprout" transform="translate(200 172) scale(1.5)"><ellipse cx="0" cy="0" rx="30" ry="7" fill="#7a4e2d"/><ellipse cx="0" cy="-2" rx="24" ry="4.500" fill="#946239"/><g class="stem"><path d="M0 -2 C0 -22 0 -34 0 -46" stroke="#2f9a50" stroke-width="4" stroke-linecap="round" fill="none"/><path class="lf l1" d="M0 -28 C-4 -46 -26 -54 -40 -46 C-38 -30 -20 -24 0 -28Z" fill="#46b862"/><path class="lf l2" d="M0 -38 C4 -58 26 -66 42 -58 C40 -40 20 -34 0 -38Z" fill="#2f9a50"/></g></g>{% endif %}
</svg>
{% endmacro %}
