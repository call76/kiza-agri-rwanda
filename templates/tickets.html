{% extends 'base.html' %}{% block body %}<h1>✉️ {{ t('Support inbox') }}</h1><div class="card"><div class="tw"><table><tr><th>#</th><th>Date</th><th>From</th><th>Topic</th><th>Message</th><th>Status</th><th></th></tr>
{% for x in ts %}<tr><td>{{x.id}}</td><td>{{x.created_at}}</td><td><b>{{x.name}}</b><div class="mut">{{x.contact}}</div></td><td>{{x.topic}}</td><td style="max-width:360px">{{x.message}}</td><td><span class="tag {{ '' if x.status=='Resolved' else 'demo' }}">{{x.status}}</span></td>
<td><form method="post">{{ csrf_input() }}<input type="hidden" name="id" value="{{x.id}}"><button class="sm" name="s" value="Resolved">Resolve</button></form></td></tr>{% else %}<tr><td colspan="7" class="mut">No messages yet.</td></tr>{% endfor %}</table></div></div>{% endblock %}
